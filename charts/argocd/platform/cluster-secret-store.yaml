apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cluster-secret-store
  namespace: argocd
  annotations:
    # Wave 1: after External Secrets (wave 0) installs the ClusterSecretStore CRD.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev-platform
  source:
    repoURL: git@github.com:basebandit/zeus.git
    targetRevision: main
    path: charts/argocd/platform/cluster-secret-store
    helm:
      parameters:
        - name: region
          value: eu-central-1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
