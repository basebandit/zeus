# Platform components project + External Secrets Operator.
# ArgoCD installs this from git after terraform bootstraps ArgoCD itself.
projects:
  dev-platform-apps:
    namespace: argocd
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    description: Cluster platform components (external-secrets, image-updater, secret store)
    sourceRepos:
      - "https://charts.external-secrets.io"
      - "https://argoproj.github.io/argo-helm"
      - "git@github.com:basebandit/zeus.git"
    destinations:
      - namespace: external-secrets
        server: https://kubernetes.default.svc
      - namespace: argocd
        server: https://kubernetes.default.svc
    # Platform components install CRDs and other cluster-scoped resources.
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
    orphanedResources:
      warn: false
    roles: []
applications:
  external-secrets:
    namespace: argocd
    project: dev-platform-apps
    additionalAnnotations:
      argocd.argoproj.io/sync-wave: "0"
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    source:
      repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.10.7 # verify/bump to current stable
      helm:
        values: |
          installCRDs: true
    destination:
      server: https://kubernetes.default.svc
      namespace: external-secrets
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
