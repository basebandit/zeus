projects:
  dev-payments-apps:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    description: A logical grouping of payments applications in the dev basebandit eks cluster
    sourceRepos:
      - "git@github.com:basebandit/zeus.git"
    destinations:
      - namespace: payments
        server: https://kubernetes.default.svc
    clusterResourceWhitelist: []
    clusterResourceBlacklist: []
    namespaceResourceBlacklist:
      - group: ""
        kind: ResourceQuota
      - group: ""
        kind: LimitRange
      - group: ""
        kind: NetworkPolicy
    orphanedResources:
      warn: false
    roles: []
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
applications:
  payments:
    namespace: argocd
    project: dev-payments-apps
    additionalLabels: {}
    additionalAnnotations:
      argocd-image-updater.argoproj.io/image-list: payments=892880329567.dkr.ecr.eu-central-1.amazonaws.com/payments
      argocd-image-updater.argoproj.io/payments.update-strategy: semver
      argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/zeus-repo
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    revisionHistoryLimit: 10
    source:
      repoURL: git@github.com:basebandit/zeus.git
      path: charts/payments
      helm:
        valueFiles:
          - dev-values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: payments
    syncPolicy:
      automated:
        allowEmpty: false
        prune: false
        selfHeal: true
      retry:
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m
        limit: 5
      syncOptions:
        - Validate=true
        - CreateNamespace=true
        - PrunePropagationPolicy=foreground
        - PruneLast=true
        - ServerSideApply=true
