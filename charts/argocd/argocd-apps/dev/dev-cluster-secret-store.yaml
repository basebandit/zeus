# ClusterSecretStore (points External Secrets at this account's SecretsManager).
# Reuses the dev-platform-apps project defined in dev-external-secrets.yaml.
# sync-wave 1 so it applies after the External Secrets CRDs (wave 0) exist.
applications:
  cluster-secret-store:
    namespace: argocd
    project: dev-platform-apps
    additionalAnnotations:
      argocd.argoproj.io/sync-wave: "1"
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    source:
      repoURL: git@github.com:basebandit/zeus.git
      targetRevision: main
      path: charts/argocd/argocd-config/dev
    destination:
      server: https://kubernetes.default.svc
      namespace: external-secrets
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ServerSideApply=true
