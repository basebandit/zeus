[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    integration: Integration tests requiring all services to be running
    unit: Unit tests

# Test options
addopts =
    --verbose
    --strict-markers
    --tb=short
    -m "not integration"

# Ignore patterns
norecursedirs =
    .git
    dist
    build
    apps
