[project]
name = "payments"
version = "2.1.0"
description = "Payment service for Zeus e-commerce platform with event-driven architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aio-pika>=9.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.11",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "black>=25.1.0",
    "commitizen>=4.8.3",
    "httpx>=0.28.1",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.8",
]

[tool.mypy]
install_types = true
non_interactive = true
python_version = "3.12"
strict = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
