[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for different test types
markers =
    unit: Unit tests
    integration: Integration tests requiring external services
    slow: Slow running tests

# Ignore patterns
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    .venv
    migrations
