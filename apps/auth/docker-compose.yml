services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - "5435:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth
      # Shared broker runs on the host (see other services' compose files).
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672/
      RABBITMQ_EXCHANGE: basebandit.events
      JWT_SECRET: dev-insecure-jwt-secret-change-me-in-prod-0123456789
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  auth_pgdata:
