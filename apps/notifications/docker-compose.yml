services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5436:5432"
    volumes:
      - notifications_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  notifications:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8086
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notifications
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672/
      RABBITMQ_EXCHANGE: basebandit.events
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "8086:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  notifications_pgdata:
