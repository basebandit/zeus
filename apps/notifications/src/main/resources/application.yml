server:
  port: ${PORT:8086}

spring:
  application:
    name: notifications
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:notifications}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672/}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:basebandit.events}
  mail:
    from: ${MAIL_FROM:no-reply@zeus.shop}

management:
  endpoints:
    web:
      exposure:
        include: health
