services:
  postgres:
    image: postgres:16-alpine
    container_name: zeus-shipping-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shipping
    ports:
      - "5437:5432"
    volumes:
      - shipping_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipping-network

  shipping:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeus-shipping-service
    environment:
      APP_NAME: shipping
      PORT: 8085
      HOST: 0.0.0.0
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: shipping
      # Shared broker on the host
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672/
      RABBITMQ_EXCHANGE: basebandit.events
      CARRIER: ZeusExpress
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shipping-network

volumes:
  shipping_postgres_data:
    driver: local

networks:
  shipping-network:
    driver: bridge
