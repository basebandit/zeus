[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --verbose
    --strict-markers
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests requiring external services

norecursedirs =
    .git
    dist
    build
    .venv
    migrations
