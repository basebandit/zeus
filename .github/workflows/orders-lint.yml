name: Orders Service - Lint & Test

on:
  push:
    branches:
      - main
    paths:
      - 'apps/orders/**'
  pull_request:
    paths:
      - 'apps/orders/**'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orders

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/orders/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Test coverage
        run: npm run test:cov

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/orders/coverage/lcov.info
          flags: orders-service
          fail_ci_if_error: false
