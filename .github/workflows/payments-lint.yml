name: Lint & Test - Payments

on:
  push:
    paths:
      - "apps/payments/**"
    branches: [main]
  pull_request:
    paths:
      - "apps/payments/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint-test:
    name: 🧹 Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payments

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for commit message checking

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 🔄 Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: 📦 Install dependencies
        run: uv sync --all-groups

      - name: ✅ Run pre-commit hooks
        run: uv run pre-commit run --files apps/payments/**/*.py --show-diff-on-failure

      - name: 🧪 Run Pytest
        run: uv run pytest --maxfail=1 --disable-warnings -v

      - name: 📊 Generate coverage report
        run: uv run pytest --cov=apps/payments --cov-report=xml