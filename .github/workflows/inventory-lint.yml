name: Lint & Test - Inventory

on:
  push:
    paths:
      - "apps/inventory/**"
    branches: [main]
  pull_request:
    paths:
      - "apps/inventory/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/inventory

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/inventory/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --files apps/inventory/**/*.go apps/inventory/go.mod apps/inventory/go.sum

      - name: Run vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run tests with race detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/inventory/coverage.out
          flags: inventory-service
          fail_ci_if_error: false
