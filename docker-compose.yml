# Full-stack local harness for the Zeus e-commerce platform.
#
# Brings up the shared RabbitMQ broker + MailHog, a Postgres per service, all seven
# backend services and the web storefront. This is for end-to-end verification and
# does NOT replace the per-service docker-compose.yml files used for isolated dev.
#
#   docker compose up --build
#
# UIs: web http://localhost:3000 · RabbitMQ http://localhost:15672 (guest/guest)
#      MailHog http://localhost:8025
#
# Schema bootstrap: orders uses TypeORM synchronize; inventory runs migrations on
# startup; auth & notifications use Flyway; payments & shipping run Alembic via their
# command override below.

x-rabbit-url: &rabbit-url amqp://guest:guest@rabbitmq:5672/
x-jwt-secret: &jwt-secret dev-insecure-jwt-secret-change-me-in-prod-0123456789

services:
  # ---- Infrastructure -----------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orders-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: orders }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10 }

  inventory-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: inventory }
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10 }

  payments-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: payments }
    ports: ["5434:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10 }

  auth-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: auth }
    ports: ["5435:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10 }

  notifications-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: notifications }
    ports: ["5436:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10 }

  shipping-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: shipping }
    ports: ["5437:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10 }

  # ---- Application services ------------------------------------------------
  orders:
    build: ./apps/orders
    depends_on:
      orders-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: orders-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: orders
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: *rabbit-url
      INVENTORY_URL: http://inventory:8082
    ports: ["8080:8080"]

  inventory:
    build: ./apps/inventory
    depends_on:
      inventory-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      PORT: 8082
      HOST: 0.0.0.0
      ENV: development
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory
      DB_SSLMODE: disable
      RUN_MIGRATIONS_ON_STARTUP: "true"
      RABBITMQ_URL: *rabbit-url
      RABBITMQ_EXCHANGE: basebandit.events
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["8082:8082"]

  payments:
    build: ./apps/payments
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8083"
    depends_on:
      payments-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      APP_NAME: payments
      PORT: 8083
      HOST: 0.0.0.0
      ENVIRONMENT: development
      DB_HOST: payments-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: payments
      RABBITMQ_URL: *rabbit-url
      RABBITMQ_EXCHANGE: basebandit.events
      PAYMENT_GATEWAY_SUCCESS_RATE: "0.9"
    ports: ["8083:8083"]

  auth:
    build: ./apps/auth
    depends_on:
      auth-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      PORT: 8084
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth
      RABBITMQ_URL: *rabbit-url
      RABBITMQ_EXCHANGE: basebandit.events
      JWT_SECRET: *jwt-secret
    ports: ["8084:8084"]

  shipping:
    build: ./apps/shipping
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8085"
    depends_on:
      shipping-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      APP_NAME: shipping
      PORT: 8085
      HOST: 0.0.0.0
      ENVIRONMENT: development
      DB_HOST: shipping-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: shipping
      RABBITMQ_URL: *rabbit-url
      RABBITMQ_EXCHANGE: basebandit.events
      CARRIER: ZeusExpress
    ports: ["8085:8085"]

  notifications:
    build: ./apps/notifications
    depends_on:
      notifications-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailhog: { condition: service_started }
    environment:
      PORT: 8086
      DB_HOST: notifications-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notifications
      RABBITMQ_URL: *rabbit-url
      RABBITMQ_EXCHANGE: basebandit.events
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports: ["8086:8086"]

  gateway:
    build: ./apps/gateway
    depends_on:
      auth: { condition: service_started }
      orders: { condition: service_started }
      inventory: { condition: service_started }
      payments: { condition: service_started }
      shipping: { condition: service_started }
    environment:
      PORT: 8081
      JWT_SECRET: *jwt-secret
      WEB_ORIGIN: http://localhost:3000
      AUTH_URL: http://auth:8084
      ORDERS_URL: http://orders:8080
      INVENTORY_URL: http://inventory:8082
      PAYMENTS_URL: http://payments:8083
      SHIPPING_URL: http://shipping:8085
    ports: ["8081:8081"]

  web:
    build: ./apps/web
    depends_on:
      gateway: { condition: service_started }
    environment:
      GATEWAY_URL: http://gateway:8081
    ports: ["3000:3000"]
